---

- name: Remove clouds.yaml
  ansible.builtin.file:
    path: "{{ playbook_dir }}/clouds.yaml"
    state: absent
  check_mode: false
  delegate_to: localhost
  run_once: true
  become: false

- name: Remove additional secrets
  ansible.builtin.file:
    path: "{{ playbook_dir }}/{{ item.dest }}"
    state: absent
  loop: "{{ os_secrets | default([]) }}"
  check_mode: false
  delegate_to: localhost
  run_once: yes
  no_log: yes
