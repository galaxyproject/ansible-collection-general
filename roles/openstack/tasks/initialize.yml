---

- name: Create network
  openstack.cloud.network:
    cloud: "{{ os_cloud_id }}"
    name: "{{ os_network.name }}"
  delegate_to: localhost
  run_once: true

- name: Create subnet
  openstack.cloud.subnet:
    network_name: "{{ os_network.name }}"
    name: "{{ os_network.subnet.name }}"
    cidr: "{{ os_network.subnet.cidr }}"
  delegate_to: localhost
  run_once: true

- name: Create router
  openstack.cloud.router:
    name: "{{ os_network.router.name }}"
    network: "{{ os_network.router.network }}"
    interfaces: "{{ os_network.router.interfaces }}"
  delegate_to: localhost
  run_once: true

- name: Create security groups
  openstack.cloud.security_group:
    cloud: "{{ os_cloud_id }}"
    name: "{{ item.name }}"
  loop: "{{ os_security_group_rules }}"
  delegate_to: localhost
  run_once: true

- name: Create security group rules
  openstack.cloud.security_group_rule:
    cloud: "{{ os_cloud_id }}"
    security_group: "{{ item.0.name }}"
    protocol: "{{ item.1.protocol | default(omit) }}"
    remote_ip_prefix: "{{ item.1.remote_ip_prefix | default(omit) }}"
    port_range_min: "{{ item.1.port_range_min | default(omit) }}"
    port_range_max: "{{ item.1.port_range_max | default(omit) }}"
  loop: "{{ os_security_group_rules | subelements('rules') }}"
  delegate_to: localhost
  run_once: true

- name: Manage network RBAC policies
  openstack.cloud.neutron_rbac_policy:
    id: "{{ item.id | default(omit) }}"
    action: "{{ item.action | default(omit) }}"
    interface: "{{ item.interface | default(omit) }}"
    object_id: "{{ item.object_id | default(omit) }}"
    object_type: "{{ item.object_type | default(omit) }}"
    project_id: "{{ item.project_id | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
    target_all_project: "{{ item.target_all_project | default(omit) }}"
    target_project_id: "{{ item.target_project_id | default(omit) }}"
  loop: "{{ os_neutron_rbac_policies }}"
  when: "os_neutron_rbac_policies is defined"
  delegate_to: localhost
  run_once: true
