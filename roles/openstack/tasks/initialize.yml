---

- name: Create networks
  openstack.cloud.network:
    cloud: "{{ os_cloud_id }}"
    name: "{{ item.name }}"
  loop: "{{ os_networks | default([os_network]) }}"
  delegate_to: localhost
  run_once: true

- name: Create subnets
  openstack.cloud.subnet:
    network_name: "{{ item.name }}"
    name: "{{ item.subnet.name }}"
    cidr: "{{ item.subnet.cidr }}"
  loop: "{{ os_networks | default([os_network]) }}"
  ignore_errors: "{{ ansible_check_mode }}"
  delegate_to: localhost
  run_once: true

- name: Create router
  openstack.cloud.router:
    name: "{{ _os_router.name }}"
    network: "{{ _os_router.network }}"
    interfaces: "{{ _os_router.interfaces }}"
  vars:
    _os_router: "{{ os_router | default(os_network.router) }}"
  delegate_to: localhost
  run_once: true

- name: Create security groups
  openstack.cloud.security_group:
    cloud: "{{ os_cloud_id }}"
    name: "{{ item.name }}"
  loop: "{{ os_security_group_rules }}"
  delegate_to: localhost
  run_once: true

- name: Set security group rules
  openstack.cloud.security_group:
    cloud: "{{ os_cloud_id }}"
    name: "{{ item.name }}"
    security_group_rules: "{{ item.rules + (item.default_egress | default(true) | ternary(os_security_group_default_egress_rules, [])) }}"
  loop: "{{ os_security_group_rules }}"
  ignore_errors: "{{ ansible_check_mode }}"
  delegate_to: localhost
  run_once: true

- name: Manage network RBAC policies
  openstack.cloud.neutron_rbac_policy:
    id: "{{ item.id | default(omit) }}"
    action: "{{ item.action | default(omit) }}"
    interface: "{{ item.interface | default(omit) }}"
    object_id: "{{ item.object_id | default(omit) }}"
    object_type: "{{ item.object_type | default(omit) }}"
    project_id: "{{ item.project_id | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
    target_all_project: "{{ item.target_all_project | default(omit) }}"
    target_project_id: "{{ item.target_project_id | default(omit) }}"
  loop: "{{ os_neutron_rbac_policies }}"
  when: "os_neutron_rbac_policies is defined"
  delegate_to: localhost
  run_once: true
